# Blitz TokyoInsider Scraper API + FlareSolverr
# Author: Blitz (@blitzlabx)

version: "3.8"

services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - TI_FLARESOLVERR_URL=http://flaresolverr:8191
      - TI_MIN_INTERVAL=0.4
    depends_on:
      - flaresolverr
    restart: unless-stopped
